<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <title>Cantina</title>
</head>
<body>
    
    <header class="flex justify-between items-center ">
        <a href="#">
            <span>Cantina</span>
        </a>
        <button class="p-1.5 rounded bg-green-600 font-bold
         text-white cursor-pointer hover:bg-green-700 transition-colors active:bg-green-500">
            Ajouter une recette +</button>

        <span id="toast" class=" p-4 absolute top-16.75 rounded transition-all opacity-0"></span>
    </header>
    <!-- <div class="background"></div> -->
    <!-- ========================================== -->

    <section class="text-gray-500 font-bold flex flex-wrap justify-between gap-1.5 my-3 mx-auto w-[90%]">
        <div class="flex flex-col bg-black w-60 p-2 border border-gray-500 rounded ">
            Plats en réserve
            <span class="text-2xl text-gray-300 plats-reserved">5</span>
        </div>
        <div  class="flex flex-col bg-black w-60 p-2 border border-gray-500 rounded">
            Jours prêts
            <span class="text-2xl text-gray-300 jours-prets">0/5</span>
        </div>
        <div  class="flex flex-col bg-black w-60 p-2 border border-gray-500 rounded">
            Coût semaine / apprenant
            <span class="text-2xl text-gray-300 cout">34 DH</span>
        </div>
        <div  class="flex flex-col bg-black w-60 p-2 border border-gray-500 rounded">
            Équilibre alimentaire
            <span  class="text-green-800 border border-green-700 rounded-4xl w-fit px-1 mt-1 opacity-80">Ajouter un plat végétarien</span>
        </div>

    </section>

    <!-- ========================================== Days Cards -->
    <p class="text-white text-2xl font-bold w-[90%] mx-auto m-2">
        Planning de la semaine</p>

    <section id="days-cards" class=" flex justify-center flex-wrap gap-1.5 w-[90%] mx-auto  ">
       

    </section>

    <!-- =============================================== -->
     <!-- ==> It's for plate cards when one card is reserved -->
        <!-- <div class="text-red-700 bg-red-300 p-0.5 text-xs 
        absolute top-0 left-0">Assigné : Mardi - Plat</div> -->

   
    <!-- ====================================== Les recette -->
     <p class="text-white text-2xl font-bold w-[90%] mx-auto m-2">
        Les recette disponibles</p>

    <section id="garde-manger" class="flex justify-center flex-wrap gap-1.5 w-[90%] mx-auto text-gray-400">
       
    </section>


    <!-- -============================== -->
      <!-- ================================= Add a recette -->
    <div class="popup-form fixed w-full h-full bg-[#00000096] top-0 z-10
     flex justify-center items-center">

        <div class="text-white bg-black p-3 rounded w-fit h-fit relative z-10 shadow-custom">
            <div class="closeMark text-red-700 font-bold text-xl absolute right-5 top-0 cursor-pointer hover:opacity-80">
                <span class="transform rotate-45 block w-fit absolute left-0.5 ml-0.5">|</span>
                <span class="transform -rotate-45 block w-fit absolute">|</span>
            </div>
            <p class="p-1.5 pb-4 font-bold text-xl text-center">Creez une Recette</p>

            <form class="flex flex-col gap-3.5">
                <div class="relative">
                    <label for="name">Nom du plat</label><br>
                    <input type="text" required id="name" class="border-2 border-gray-500 rounded p-0.5">
                    <span id="name-error" class="block text-[11px] text-red-700 font-bold absolute"></span>
                </div>
                <div>
                    <label for="cat">Catégorie</label><br>
                    <select required name="cat" id="cat" class="border-2 border-gray-500 rounded p-0.5 bg-black">
                        <option value="Entrée">Entrée</option>
                        <option value="Plat principal">Plat principal</option>
                        <option value="Dessert">Dessert</option>
                    </select><br>
                </div>
                <div>
                    <label for="badge">Badge</label><br>
                    <select required name="badge" id="badge" class="border-2 border-gray-500 rounded p-0.5 bg-black">
                        <option value="Bio">Bio</option>
                        <option value="Végétarien">Végétarien</option>
                        <option value="Classique">Classique</option>
                    </select><br>
                </div>
                <div>
                    <label for="price" >Prix</label><br>
                    <input type="text" required id="price" class="border-2 border-gray-500 rounded p-0.5">
                    <span id="price-error" class="block text-[11px] text-red-700 font-bold absolute"></span>
                </div>
                
                <div class="pt-2 relative">
                    <button id="create-btn" class="bg-blue-800 px-1.5 text-white rounded cursor-pointer hover:opacity-80">Creer</button>
                    <div class="annule border border-red-700 px-1.5 rounded cursor-pointer hover:opacity-80 hover:text-red-700 inline">Annule</div>
                    
                    <span id="val-error" class="block text-[11px] text-red-700 font-bold absolute"></span>
                </div>
            </form>
            
            </div>
    </div>

      <!-- ================================= Modify a recette -->
    <div class="popup-modify-form fixed w-full h-full bg-[#00000096] top-0 z-10
     flex justify-center items-center">

        <div class="text-white bg-black p-3 rounded w-fit h-fit relative z-10 shadow-custom">
            <div class="closeMark text-red-700 font-bold text-xl absolute right-5 top-0 cursor-pointer hover:opacity-80">
                <span class="transform rotate-45 block w-fit absolute left-0.5 ml-0.5">|</span>
                <span class="transform -rotate-45 block w-fit absolute">|</span>
            </div>
            <p class="p-1.5 pb-4 font-bold text-xl text-center">Modifier une Recette</p>

            <form class="flex flex-col gap-3.5">
                <div class="relative">
                    <label for="name">Nom du plat</label><br>
                    <input type="text" required id="name" class="border-2 border-gray-500 rounded p-0.5">
                    <span id="name-error" class="block text-[11px] text-red-700 font-bold absolute"></span>
                </div>
                <div>
                    <label for="cat">Catégorie</label><br>
                    <select required name="cat" id="cat" class="border-2 border-gray-500 rounded p-0.5 bg-black">
                        <option value="Entrée">Entrée</option>
                        <option value="Plat principal">Plat principal</option>
                        <option value="Dessert">Dessert</option>
                    </select><br>
                </div>
                <div>
                    <label for="badge">Badge</label><br>
                    <select required name="badge" id="badge" class="border-2 border-gray-500 rounded p-0.5 bg-black">
                        <option value="Bio">Bio</option>
                        <option value="Végétarien">Végétarien</option>
                        <option value="Classique">Classique</option>
                    </select><br>
                </div>
                <div>
                    <label for="price" >Prix</label><br>
                    <input type="text" required id="price" class="border-2 border-gray-500 rounded p-0.5">
                    <span id="price-error" class="block text-[11px] text-red-700 font-bold absolute"></span>
                </div>
                
                <div class="pt-2 relative">
                    <button id="modify-btn" class="bg-blue-800 px-1.5 text-white rounded cursor-pointer hover:opacity-80">Modify</button>
                    <div class="annule border border-red-700 px-1.5 rounded cursor-pointer hover:opacity-80 hover:text-red-700 inline">Annule</div>
                    
                    <span id="val-error" class="block text-[11px] text-red-700 font-bold absolute"></span>
                </div>
            </form>
            
            </div>
    </div>

    <script src="interactions.js"></script>
</body>
</html>
